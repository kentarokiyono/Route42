<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Route 42 - 南紀 巡礼の道</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <style>
        :root {
            --washi: #f3ede1;
            --paper: #faf6ee;
            --ink: #1a1a1a;
            --ink-sub: #5a5248;
            --ink-mute: #8a7f70;
            --shu: #b83a2b;
            --line: #e3d9c6;
            --nav-h: calc(64px + env(safe-area-inset-bottom));
            --mincho: 'Shippori Mincho', serif;
            --sans: 'Noto Sans JP', sans-serif;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--washi); color: var(--ink); font-family: var(--sans); }
        button { font-family: inherit; cursor: pointer; }
        #app { position: relative; width: 100%; height: 100vh; height: 100dvh; }
        #map { position: absolute; top: 0; left: 0; right: 0; bottom: var(--nav-h); }

        /* header */
        header { position: absolute; top: 0; left: 0; right: 0; z-index: 100; padding: calc(16px + env(safe-area-inset-top)) 16px 28px; display: flex; justify-content: space-between; align-items: flex-start; background: linear-gradient(var(--washi) 55%, rgba(243,237,225,0)); pointer-events: none; }
        .brand-sub { display: block; font-size: 11px; letter-spacing: 0.2em; color: var(--ink-sub); }
        .brand-title { margin: 0; font-family: var(--mincho); font-size: 24px; font-weight: 700; letter-spacing: 0.08em; }
        .progress { pointer-events: auto; display: flex; flex-direction: column; align-items: center; padding: 6px 12px; border: 1.5px solid var(--shu); border-radius: 6px; color: var(--shu); background: var(--washi); }
        .progress-num { font-family: var(--mincho); font-size: 18px; font-weight: 700; line-height: 1.1; }
        .progress-num small { font-size: 12px; }
        .progress-label { font-size: 10px; letter-spacing: 0.1em; }
        .mapboxgl-ctrl-top-right { top: calc(84px + env(safe-area-inset-top)); }

        /* markers */
        .marker { display: flex; flex-direction: column; align-items: center; background: none; border: none; padding: 0; min-width: 44px; min-height: 44px; }
        .marker-seal { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--mincho); font-size: 14px; font-weight: 700; background: var(--paper); color: var(--shu); border: 2px solid var(--shu); box-shadow: 0 1px 4px rgba(60,40,20,0.25); transition: transform .15s; }
        .marker.visited .marker-seal { background: var(--shu); color: #fff; }
        .marker.current .marker-seal { transform: scale(1.25); box-shadow: 0 0 0 6px rgba(184,58,43,0.2); }
        .marker-label { margin-top: 3px; font-size: 11px; font-weight: 500; color: var(--ink); text-shadow: 0 0 3px var(--paper), 0 0 3px var(--paper), 0 0 3px var(--paper); white-space: nowrap; }

        /* bottom sheet */
        .sheet { position: absolute; left: 0; right: 0; bottom: var(--nav-h); z-index: 150; max-height: calc(100dvh - var(--nav-h) - 120px); overflow-y: auto; background: var(--paper); border-radius: 20px 20px 0 0; box-shadow: 0 -4px 20px rgba(60,40,20,0.12); padding: 10px 20px 18px; display: flex; flex-direction: column; gap: 12px; transform: translateY(110%); transition: transform .25s ease; }
        .sheet.open { transform: translateY(0); }
        .sheet-top { display: flex; justify-content: space-between; align-items: center; }
        .handle { width: 36px; height: 4px; border-radius: 2px; background: #d6cbb6; margin: 0 auto; }
        .icon-btn { width: 44px; height: 44px; border: none; background: none; color: var(--ink-sub); font-size: 24px; line-height: 1; display: flex; align-items: center; justify-content: center; }
        .spot-head { display: flex; align-items: center; gap: 14px; }
        .seal-lg { width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--shu); display: flex; align-items: center; justify-content: center; font-family: var(--mincho); font-size: 22px; font-weight: 700; color: var(--shu); }
        .seal-lg.visited { background: var(--shu); color: #fff; }
        .spot-meta { font-size: 11px; color: var(--ink-sub); letter-spacing: 0.1em; }
        .spot-title { margin: 0; font-family: var(--mincho); font-size: 28px; font-weight: 700; letter-spacing: 0.1em; }
        .spot-desc { margin: 0; font-size: 14px; line-height: 1.8; color: #2e2a25; }
        .leg { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 4px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-sub); }
        .leg strong { color: var(--ink); }
        .leg-val { white-space: nowrap; }
        .stamps { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .stamps-label { font-size: 11px; color: var(--ink-sub); margin-right: 4px; }
        .stamp { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--mincho); font-size: 12px; font-weight: 700; border: 1px solid #cfc3ad; color: var(--ink-mute); background: none; padding: 0; }
        .stamp.visited { background: var(--shu); border-color: var(--shu); color: #fff; }
        .stamp.current { border: 1.5px dashed var(--shu); color: var(--shu); }
        .actions { display: flex; gap: 10px; }
        .btn { flex: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 15px; font-weight: 700; text-decoration: none; border: 1.5px solid var(--shu); }
        .btn-primary { background: var(--shu); color: #fff; }
        .btn-outline { background: transparent; color: var(--shu); }
        .btn-outline.done { background: rgba(184,58,43,0.08); }
        .pager { display: flex; justify-content: space-between; }
        .pager button { min-height: 44px; padding: 0 8px; border: none; background: none; color: var(--ink-sub); font-size: 13px; }
        .pager button:disabled { visibility: hidden; }
        .route-link { font-size: 12px; color: var(--shu); }

        /* 御朱印帳 panel */
        .book { position: absolute; top: 0; left: 0; right: 0; bottom: var(--nav-h); z-index: 160; background: var(--washi); overflow-y: auto; padding: calc(20px + env(safe-area-inset-top)) 20px 20px; display: none; }
        .book.open { display: block; }
        .book h2 { margin: 0 0 4px; font-family: var(--mincho); font-size: 24px; letter-spacing: 0.1em; }
        .book-total { margin: 0 0 16px; font-size: 12px; color: var(--ink-sub); }
        .book-list { list-style: none; margin: 0; padding: 0; }
        .book-item { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 4px; background: none; border: none; border-bottom: 1px solid var(--line); text-align: left; color: var(--ink); }
        .book-item .seal-lg { width: 40px; height: 40px; font-size: 18px; }
        .book-name { font-family: var(--mincho); font-size: 18px; font-weight: 700; }
        .book-leg { font-size: 11px; color: var(--ink-sub); }

        /* tab bar */
        .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--nav-h); padding-bottom: env(safe-area-inset-bottom); z-index: 200; background: var(--paper); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; }
        .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 72px; min-height: 48px; justify-content: center; background: none; border: none; color: var(--ink-sub); font-size: 11px; }
        .tab[aria-selected="true"] { color: var(--shu); font-weight: 700; }
        .tab svg { width: 22px; height: 22px; }
    </style>
</head>
<body>
<div id="app">
    <div id="map" role="region" aria-label="ルート地図"></div>

    <header>
        <div>
            <span class="brand-sub">南紀 巡礼の道</span>
            <h1 class="brand-title">国道四十二号</h1>
        </div>
        <div class="progress" aria-live="polite">
            <span class="progress-num"><span id="visitedCount">〇</span><small> / 七</small></span>
            <span class="progress-label">参拝済</span>
        </div>
    </header>

    <section class="sheet" id="sheet" aria-label="札所の詳細" aria-hidden="true">
        <div class="sheet-top">
            <span style="width:44px"></span>
            <div class="handle"></div>
            <button class="icon-btn" type="button" id="closeSheet" aria-label="閉じる">×</button>
        </div>
        <div class="spot-head">
            <div class="seal-lg" id="spotSeal"></div>
            <div>
                <div class="spot-meta" id="spotMeta"></div>
                <h2 class="spot-title" id="spotName"></h2>
            </div>
        </div>
        <p class="spot-desc" id="spotDesc"></p>
        <div class="leg" id="leg">
            <span id="legLabel"></span>
            <span class="leg-val" id="legVal"></span>
        </div>
        <div class="stamps" id="stamps"><span class="stamps-label">御朱印</span></div>
        <div class="actions">
            <a class="btn btn-primary" id="navLink" target="_blank" rel="noopener">ナビ開始</a>
            <button class="btn btn-outline" type="button" id="visitBtn">参拝する（押印）</button>
        </div>
        <div class="pager">
            <button type="button" id="prevBtn">‹ 前の札所</button>
            <a class="route-link" id="nextRouteLink" target="_blank" rel="noopener" style="align-self:center">次の札所への道順</a>
            <button type="button" id="nextBtn">次の札所 ›</button>
        </div>
    </section>

    <section class="book" id="book" aria-label="御朱印帳">
        <h2>御朱印帳</h2>
        <p class="book-total" id="bookTotal"></p>
        <ul class="book-list" id="bookList"></ul>
    </section>

    <nav class="tabbar" role="tablist">
        <button class="tab" type="button" role="tab" id="tabMap" aria-selected="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
            地図
        </button>
        <button class="tab" type="button" role="tab" id="tabBook" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2V3z"/><circle cx="12" cy="11" r="3.5"/></svg>
            御朱印帳
        </button>
    </nav>
</div>

<script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoia2VudGFyb3dreW10b3VyaXNtIiwiYSI6ImNtbGVzZTZpOTFvNHkzZW9mY2R0aHQ2a3UifQ.E9eZXhlwt6vC0yNkoX3QcA';

    var NUM = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
    var STORAGE_KEY = 'route42.visited';

    // 巡る順。座標は [経度, 緯度]
    var spots = [
        { name: "枯木灘", tag: "起点", coords: [135.4851, 33.5415], desc: "ロードトリップの起点。リアス式海岸の絶景が続く、聖なる道の始まり。" },
        { name: "海中ポスト", tag: "すさみ", coords: [135.4997, 33.5378], desc: "水深10mのポスト。冒険と想いを届ける場所。" },
        { name: "潮岬", tag: "本州最南端", coords: [135.7625, 33.4330], desc: "本州最南端。地球の丸さを実感する、断崖の果て。" },
        { name: "樫野埼灯台", tag: "紀伊大島", coords: [135.8622, 33.4717], desc: "日本最古の石造灯台。人類の絆を伝える聖域。" },
        { name: "橋杭岩", tag: "串本", coords: [135.7957, 33.4882], desc: "850m続く奇岩列。地質学と伝説が交差する地。" },
        { name: "古座川の一枚岩", tag: "寄り道・古座川", coords: [135.7392, 33.5787], desc: "高さ100mの巨岩壁。1500万年前のマグマの記憶。" },
        { name: "太地くじらの博物館", tag: "終着", coords: [135.9450, 33.5970], desc: "終着点。海と人の共生の歴史を辿る地。" }
    ];

    var legs = null;        // [{distance(m), duration(s)}], legs[i] = spots[i] → spots[i+1]
    var legsFailed = false;
    var current = -1;
    var markers = [];
    var visited = loadVisited();

    function loadVisited() {
        try {
            var v = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            return Array.isArray(v) ? v.filter(function (i) { return Number.isInteger(i) && i >= 0 && i < spots.length; }) : [];
        } catch (e) { return []; }
    }
    function saveVisited() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(visited)); } catch (e) { /* 保存不可でも動作は継続 */ }
    }
    function isVisited(i) { return visited.indexOf(i) !== -1; }

    function kanji(n) {
        if (n <= 10) return n === 0 ? '〇' : NUM[n - 1];
        return String(n);
    }
    function fmtDist(m) { return '約' + (m < 10000 ? (m / 1000).toFixed(1) : Math.round(m / 1000)) + 'km'; }
    function fmtTime(s) {
        var min = Math.max(1, Math.round(s / 60));
        if (min < 60) return '約' + min + '分';
        var h = Math.floor(min / 60), r = min % 60;
        return '約' + h + '時間' + (r ? r + '分' : '');
    }
    function legText(i) {
        if (legs && legs[i]) return fmtDist(legs[i].distance) + '・' + fmtTime(legs[i].duration);
        return legsFailed ? '—' : '計算中…';
    }
    function gmapsDir(dest, origin) {
        var url = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + dest[1] + ',' + dest[0];
        if (origin) url += '&origin=' + origin[1] + ',' + origin[0];
        return url;
    }

    var map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/light-v11',
        center: [135.72, 33.51],
        zoom: 9.5
    });
    map.addControl(new mapboxgl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true,
        showUserHeading: true
    }), 'top-right');

    function fitAll() {
        var b = new mapboxgl.LngLatBounds();
        spots.forEach(function (s) { b.extend(s.coords); });
        map.fitBounds(b, { padding: { top: 110, bottom: 40, left: 40, right: 40 }, duration: 0 });
    }

    function setRoute(coords) {
        var data = { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } };
        var src = map.getSource('route42');
        if (src) { src.setData(data); return; }
        map.addSource('route42', { type: 'geojson', data: data });
        map.addLayer({ id: 'route42-casing', type: 'line', source: 'route42',
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: { 'line-color': '#ffffff', 'line-width': 7 } });
        map.addLayer({ id: 'route42-line', type: 'line', source: 'route42',
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: { 'line-color': '#b83a2b', 'line-width': 3.5 } });
    }

    function loadDirections() {
        var wp = spots.map(function (s) { return s.coords[0] + ',' + s.coords[1]; }).join(';');
        var url = 'https://api.mapbox.com/directions/v5/mapbox/driving/' + wp +
            '?geometries=geojson&overview=full&language=ja&access_token=' + mapboxgl.accessToken;
        fetch(url)
            .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(function (json) {
                var route = json.routes && json.routes[0];
                if (!route) throw new Error('no route');
                setRoute(route.geometry.coordinates);
                legs = route.legs.map(function (l) { return { distance: l.distance, duration: l.duration }; });
                refresh();
            })
            .catch(function (err) {
                console.warn('Directions API failed:', err);
                legsFailed = true;
                refresh();
            });
    }

    function applyWashiStyle() {
        var set = function (layer, prop, val) {
            if (map.getLayer(layer)) { try { map.setPaintProperty(layer, prop, val); } catch (e) {} }
        };
        set('land', 'background-color', '#efe8da');
        set('water', 'fill-color', '#d7e1e3');
    }

    function buildMarkers() {
        spots.forEach(function (spot, i) {
            var el = document.createElement('button');
            el.type = 'button';
            el.className = 'marker';
            el.setAttribute('aria-label', (i + 1) + '番 ' + spot.name);
            var seal = document.createElement('span');
            seal.className = 'marker-seal';
            seal.textContent = kanji(i + 1);
            var label = document.createElement('span');
            label.className = 'marker-label';
            label.textContent = spot.name;
            el.appendChild(seal);
            el.appendChild(label);
            el.addEventListener('click', function (e) { e.stopPropagation(); openSpot(i); });
            markers.push(el);
            new mapboxgl.Marker({ element: el, anchor: 'top', offset: [0, -15] }).setLngLat(spot.coords).addTo(map);
        });
    }

    function refresh() {
        document.getElementById('visitedCount').textContent = kanji(visited.length);
        markers.forEach(function (el, i) {
            el.classList.toggle('visited', isVisited(i));
            el.classList.toggle('current', i === current);
        });
        if (current >= 0) renderSheet();
        renderBook();
    }

    function renderSheet() {
        var i = current, spot = spots[i], last = i === spots.length - 1;
        var seal = document.getElementById('spotSeal');
        seal.textContent = kanji(i + 1);
        seal.classList.toggle('visited', isVisited(i));
        document.getElementById('spotMeta').textContent = '第' + kanji(i + 1) + '番 ・ ' + spot.tag;
        document.getElementById('spotName').textContent = spot.name;
        document.getElementById('spotDesc').textContent = spot.desc;

        var legLabel = document.getElementById('legLabel');
        var legVal = document.getElementById('legVal');
        legLabel.textContent = '';
        if (last) {
            legLabel.textContent = '結願 — 全札所の終着';
            legVal.textContent = '';
        } else {
            legLabel.appendChild(document.createTextNode('次の札所 '));
            var strong = document.createElement('strong');
            strong.textContent = kanji(i + 2) + ' ' + spots[i + 1].name;
            legLabel.appendChild(strong);
            legVal.textContent = legText(i);
        }

        var stamps = document.getElementById('stamps');
        while (stamps.children.length > 1) stamps.removeChild(stamps.lastChild);
        spots.forEach(function (s, j) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'stamp' + (isVisited(j) ? ' visited' : '') + (j === i ? ' current' : '');
            b.textContent = kanji(j + 1);
            b.setAttribute('aria-label', (j + 1) + '番 ' + s.name + (isVisited(j) ? '（参拝済）' : ''));
            b.addEventListener('click', function () { openSpot(j); });
            stamps.appendChild(b);
        });

        document.getElementById('navLink').href = gmapsDir(spot.coords);
        var visitBtn = document.getElementById('visitBtn');
        visitBtn.textContent = isVisited(i) ? '参拝済（取り消す）' : '参拝する（押印）';
        visitBtn.classList.toggle('done', isVisited(i));

        document.getElementById('prevBtn').disabled = i === 0;
        document.getElementById('nextBtn').disabled = last;
        var routeLink = document.getElementById('nextRouteLink');
        routeLink.style.visibility = last ? 'hidden' : 'visible';
        if (!last) routeLink.href = gmapsDir(spots[i + 1].coords, spot.coords);
    }

    function renderBook() {
        var total = document.getElementById('bookTotal');
        if (legs) {
            var d = 0, t = 0;
            legs.forEach(function (l) { d += l.distance; t += l.duration; });
            total.textContent = '全' + spots.length + '札所 ・ 全行程 ' + fmtDist(d) + '・' + fmtTime(t) + '（車）';
        } else {
            total.textContent = '全' + spots.length + '札所 ・ 全行程 ' + (legsFailed ? '—' : '計算中…');
        }
        var list = document.getElementById('bookList');
        list.textContent = '';
        spots.forEach(function (s, i) {
            var li = document.createElement('li');
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'book-item';
            var seal = document.createElement('span');
            seal.className = 'seal-lg' + (isVisited(i) ? ' visited' : '');
            seal.textContent = kanji(i + 1);
            var txt = document.createElement('span');
            var name = document.createElement('div');
            name.className = 'book-name';
            name.textContent = s.name;
            var leg = document.createElement('div');
            leg.className = 'book-leg';
            leg.textContent = (isVisited(i) ? '参拝済' : '未参拝') + (i < spots.length - 1 ? ' ・ 次まで ' + legText(i) : ' ・ 終着');
            txt.appendChild(name);
            txt.appendChild(leg);
            b.appendChild(seal);
            b.appendChild(txt);
            b.addEventListener('click', function () { showTab('map'); openSpot(i); });
            li.appendChild(b);
            list.appendChild(li);
        });
    }

    function openSpot(i) {
        current = i;
        var sheet = document.getElementById('sheet');
        sheet.classList.add('open');
        sheet.setAttribute('aria-hidden', 'false');
        refresh();
        var h = sheet.offsetHeight;
        map.flyTo({ center: spots[i].coords, zoom: 13, padding: { top: 100, bottom: h, left: 0, right: 0 } });
    }

    function closeSheet() {
        current = -1;
        var sheet = document.getElementById('sheet');
        sheet.classList.remove('open');
        sheet.setAttribute('aria-hidden', 'true');
        refresh();
    }

    function showTab(name) {
        document.getElementById('tabMap').setAttribute('aria-selected', name === 'map');
        document.getElementById('tabBook').setAttribute('aria-selected', name === 'book');
        document.getElementById('book').classList.toggle('open', name === 'book');
    }

    document.getElementById('closeSheet').addEventListener('click', closeSheet);
    document.getElementById('prevBtn').addEventListener('click', function () { if (current > 0) openSpot(current - 1); });
    document.getElementById('nextBtn').addEventListener('click', function () { if (current < spots.length - 1) openSpot(current + 1); });
    document.getElementById('visitBtn').addEventListener('click', function () {
        if (current < 0) return;
        var k = visited.indexOf(current);
        if (k === -1) visited.push(current); else visited.splice(k, 1);
        saveVisited();
        refresh();
    });
    document.getElementById('tabMap').addEventListener('click', function () { showTab('map'); });
    document.getElementById('tabBook').addEventListener('click', function () { closeSheet(); showTab('book'); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
    map.on('click', closeSheet);

    map.on('load', function () {
        applyWashiStyle();
        setRoute(spots.map(function (s) { return s.coords; })); // 道路形状取得までの仮表示
        buildMarkers();
        fitAll();
        refresh();
        loadDirections();
    });
</script>
</body>
</html>
