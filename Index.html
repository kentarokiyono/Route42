<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Route 42 - 南紀 巡礼の道</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <style>
        :root {
            --bg: #f2f2f7;
            --card: #ffffff;
            --label: #1c1c1e;
            --label-2: #6c6c70;
            --accent: #0071e3;
            --accent-fill: #0071e3;
            --accent-tint: rgba(0, 113, 227, 0.12);
            --sep: rgba(60, 60, 67, 0.18);
            --fill: rgba(120, 120, 128, 0.12);
            --chrome: rgba(249, 249, 249, 0.94);
            --banner: #1c1c1e;
            --danger: #d70015;
            --warn-tint: rgba(255, 149, 0, 0.14);
            --map-label: #1c1c1e;
            --map-halo: #ffffff;
            --nav-h: calc(56px + env(safe-area-inset-bottom));
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card: #1c1c1e;
                --label: #ffffff;
                --label-2: #aeaeb2;
                --accent: #0a84ff;
                --accent-tint: rgba(10, 132, 255, 0.18);
                --sep: rgba(84, 84, 88, 0.65);
                --fill: rgba(118, 118, 128, 0.24);
                --chrome: rgba(22, 22, 24, 0.94);
                --banner: #2c2c2e;
                --warn-tint: rgba(255, 159, 10, 0.18);
                --map-label: #ffffff;
                --map-halo: #000000;
                color-scheme: dark;
            }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--label); font-family: var(--font); -webkit-font-smoothing: antialiased; }
        button { font-family: inherit; cursor: pointer; color: inherit; }
        [hidden] { display: none !important; }
        #app { position: relative; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
        #map { position: absolute; top: 0; left: 0; right: 0; bottom: var(--nav-h); }

        /* header */
        header { position: absolute; top: 0; left: 0; right: 0; z-index: 100; padding: calc(12px + env(safe-area-inset-top)) 16px 20px; background: linear-gradient(var(--bg) 60%, transparent); pointer-events: none; display: flex; flex-direction: column; gap: 8px; }
        .head-row { display: flex; justify-content: space-between; align-items: flex-end; }
        .brand-sub { display: block; font-size: 13px; font-weight: 600; color: var(--label-2); }
        .brand-title { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
        .progress { pointer-events: auto; display: flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 16px; background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .progress-num { font-size: 17px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
        .progress-num small { font-size: 13px; font-weight: 600; color: var(--label-2); }
        .progress-label { font-size: 12px; color: var(--label-2); }
        .banner { pointer-events: auto; text-decoration: none; display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: 12px; background: var(--banner); color: #fff; font-size: 13px; }
        .banner strong { font-size: 15px; }
        .banner.alert { background: var(--danger); }
        .banner-sub { font-size: 13px; opacity: 0.9; }
        .notice { pointer-events: auto; padding: 10px 14px; border-radius: 12px; background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,0.08); font-size: 14px; line-height: 1.5; white-space: pre-line; }
        .notice small { display: block; color: var(--label-2); font-size: 12px; }
        .mapboxgl-ctrl-top-right { top: var(--ctrl-top, calc(84px + env(safe-area-inset-top))); }

        /* markers */
        .marker { position: relative; display: flex; flex-direction: column; align-items: center; background: none; border: none; padding: 0; min-width: 44px; min-height: 44px; }
        .marker-seal { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; background: #ffffff; color: #0071e3; border: 2px solid #0071e3; box-shadow: 0 1px 4px rgba(0,0,0,0.25); transition: transform .15s; }
        .marker.square .marker-seal { border-radius: 8px; }
        .marker.site .marker-seal { background: #1c1c1e; color: #fff; border-color: #1c1c1e; }
        .marker.visited .marker-seal { background: #0071e3; color: #fff; }
        .marker.current .marker-seal { transform: scale(1.2); box-shadow: 0 0 0 6px rgba(0,113,227,0.25); }
        .marker-label { margin-top: 3px; font-size: 11px; font-weight: 600; color: var(--map-label); text-shadow: 0 0 3px var(--map-halo), 0 0 3px var(--map-halo), 0 0 3px var(--map-halo); white-space: nowrap; }
        .cong { position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 10px; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 1.5px solid #fff; }

        /* bottom sheet */
        .sheet { position: absolute; left: 0; right: 0; bottom: var(--nav-h); z-index: 150; max-height: calc(100dvh - var(--nav-h) - 120px); overflow-y: auto; background: var(--card); border-radius: 14px 14px 0 0; box-shadow: 0 -2px 16px rgba(0,0,0,0.12); padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 12px; transform: translateY(110%); transition: transform .25s ease; }
        .sheet:not(.open) { visibility: hidden; transition: transform .25s ease, visibility 0s .25s; }
        .sheet.open { transform: translateY(0); }
        .sheet-top { display: flex; justify-content: space-between; align-items: center; }
        .handle { width: 36px; height: 5px; border-radius: 3px; background: var(--fill); margin: 0 auto; }
        .icon-btn { width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center; font-size: 0; }
        .icon-btn::before { content: "×"; width: 30px; height: 30px; border-radius: 50%; background: var(--fill); color: var(--label-2); font-size: 20px; line-height: 30px; text-align: center; }
        .spot-head { display: flex; align-items: center; gap: 12px; }
        .seal-lg { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: var(--accent); }
        .seal-lg.visited { background: var(--accent-fill); border-color: var(--accent-fill); color: #fff; }
        .spot-meta { font-size: 13px; color: var(--label-2); }
        .spot-title { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
        .spot-desc { margin: 0; font-size: 15px; line-height: 1.6; }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 0; border-top: 0.5px solid var(--sep); font-size: 15px; }
        .row:last-of-type { border-bottom: 0.5px solid var(--sep); }
        .row > span:first-child { color: var(--label-2); }
        .row strong { color: var(--label); font-weight: 600; }
        .row-val { white-space: nowrap; color: var(--label-2); font-size: 13px; }
        .pill { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 12px; color: #fff; font-size: 13px; font-weight: 600; }
        .pill.none { background: var(--fill); color: var(--label-2); }
        .guide { padding: 12px 14px; border-radius: 12px; background: var(--warn-tint); font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; gap: 10px; }
        .guide button { align-self: flex-start; min-height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: var(--card); color: var(--accent); font-weight: 600; font-size: 15px; }
        .stamps { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .stamps-label { font-size: 13px; color: var(--label-2); margin-right: 4px; }
        .stamp { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; border: 1px solid var(--sep); color: var(--label-2); background: none; padding: 0; }
        .stamp.visited { background: var(--accent-fill); border-color: var(--accent-fill); color: #fff; }
        .stamp.current { border: 2px solid var(--accent); color: var(--accent); }
        .actions { display: flex; gap: 10px; }
        .btn { flex: 1; min-height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 17px; font-weight: 600; text-decoration: none; border: none; }
        .btn-primary { background: var(--accent-fill); color: #fff; }
        .btn-outline { background: var(--accent-tint); color: var(--accent); }
        .btn-outline.done { background: var(--fill); color: var(--label-2); }
        .pager { display: flex; justify-content: space-between; }
        .pager button { min-height: 44px; padding: 0 4px; border: none; background: none; color: var(--accent); font-size: 15px; }
        .pager button:disabled { visibility: hidden; }
        .route-link { font-size: 15px; color: var(--accent); align-self: center; text-decoration: none; }

        /* list panel */
        .book { position: absolute; top: 0; left: 0; right: 0; bottom: var(--nav-h); z-index: 160; background: var(--bg); overflow-y: auto; padding: calc(16px + env(safe-area-inset-top)) 16px 20px; display: none; }
        .book.open { display: block; }
        .book h2 { margin: 0 0 4px; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
        .book-total { margin: 0 0 16px; font-size: 13px; color: var(--label-2); }
        .book-list { list-style: none; margin: 0; padding: 0 0 0 16px; background: var(--card); border-radius: 12px; }
        .book-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 0; background: none; border: none; border-bottom: 0.5px solid var(--sep); text-align: left; }
        .book-list li:last-child .book-item { border-bottom: none; }
        .book-item .seal-lg { width: 36px; height: 36px; font-size: 15px; }
        .book-item .grow { flex: 1; min-width: 0; }
        .book-name { font-size: 17px; }
        .book-leg { font-size: 13px; color: var(--label-2); }

        /* tab bar */
        .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--nav-h); padding-bottom: env(safe-area-inset-bottom); z-index: 200; background: var(--chrome); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: 0.5px solid var(--sep); display: flex; justify-content: space-around; align-items: center; }
        .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 72px; min-height: 48px; justify-content: center; background: none; border: none; color: var(--label-2); font-size: 10px; font-weight: 500; }
        .tab[aria-selected="true"] { color: var(--accent); }
        .tab svg { width: 24px; height: 24px; }
    </style>
    <script src="js/sw-register.js"></script>
</head>
<body>
<div id="app">
    <div id="map" role="region" aria-label="地図"></div>

    <header id="header">
        <div class="head-row">
            <div>
                <span class="brand-sub" id="brandSub">南紀 巡礼の道</span>
                <h1 class="brand-title" id="brandTitle">国道42号</h1>
            </div>
            <div class="progress" id="progress" aria-live="polite">
                <span class="progress-num"><span id="visitedCount">0</span><small> / <span id="spotTotal">7</span></small></span>
                <span class="progress-label">参拝済</span>
            </div>
        </div>
        <a class="banner" id="launchBanner" href="status.html" aria-live="polite" hidden>
            <strong id="launchState"></strong>
            <span class="banner-sub" id="launchSub"></span>
            <span class="banner-sub">見学場・駐車場の混雑情報を見る ›</span>
        </a>
        <div class="notice" id="notice" aria-live="polite" hidden></div>
    </header>

    <section class="sheet" id="sheet" aria-label="スポットの詳細" aria-hidden="true">
        <div class="sheet-top">
            <span style="width:44px"></span>
            <div class="handle"></div>
            <button class="icon-btn" type="button" id="closeSheet" aria-label="閉じる">×</button>
        </div>
        <div class="spot-head">
            <div class="seal-lg" id="spotSeal"></div>
            <div>
                <div class="spot-meta" id="spotMeta"></div>
                <h2 class="spot-title" id="spotName"></h2>
            </div>
        </div>
        <p class="spot-desc" id="spotDesc"></p>
        <div>
            <div class="row">
                <span>混雑状況</span>
                <span class="row-val" id="congVal"></span>
            </div>
            <div class="row" id="legRow">
                <span id="legLabel"></span>
                <span class="row-val" id="legVal"></span>
            </div>
        </div>
        <div class="guide" id="guide" hidden>
            <span id="guideText"></span>
            <button type="button" id="guideBtn"></button>
        </div>
        <div class="stamps" id="stamps"><span class="stamps-label">御朱印</span></div>
        <div class="actions">
            <a class="btn btn-primary" id="navLink" target="_blank" rel="noopener">ナビ開始</a>
            <button class="btn btn-outline" type="button" id="visitBtn">参拝する（押印）</button>
        </div>
        <div class="pager" id="pager">
            <button type="button" id="prevBtn">‹ 前の札所</button>
            <a class="route-link" id="nextRouteLink" target="_blank" rel="noopener">次の札所への道順</a>
            <button type="button" id="nextBtn">次の札所 ›</button>
        </div>
    </section>

    <section class="book" id="book" aria-label="一覧">
        <h2 id="bookTitle">御朱印帳</h2>
        <p class="book-total" id="bookTotal"></p>
        <ul class="book-list" id="bookList"></ul>
    </section>

    <nav class="tabbar" role="tablist">
        <button class="tab" type="button" role="tab" id="tabMap" aria-selected="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
            地図
        </button>
        <button class="tab" type="button" role="tab" id="tabBook" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2V3z"/><circle cx="12" cy="11" r="3.5"/></svg>
            <span id="tabBookLabel">御朱印帳</span>
        </button>
    </nav>
</div>

<script type="module">
    import { createStore, LEVELS, LAUNCH_STATES, defaultLive, freshLevel, formatClock, formatLaunchTime } from './js/store.js';

    mapboxgl.accessToken = 'pk.eyJ1Ijoia2VudGFyb3dreW10b3VyaXNtIiwiYSI6ImNtbGVzZTZpOTFvNHkzZW9mY2R0aHQ2a3UifQ.E9eZXhlwt6vC0yNkoX3QcA';

    const STORAGE_KEY = 'route42.visited';
    const $ = (id) => document.getElementById(id);

    const SPOTS = await fetch('data/spots.json').then((r) => r.json());
    const pilgrim = SPOTS.pilgrim;

    // 一般向け巡礼マップ。混雑情報は公開データ（public/current）を定期取得。
    let live = defaultLive();
    let legs = null;          // legs[i] = pilgrim[i] → pilgrim[i+1]
    let legsFailed = false;
    let current = -1;
    let markers = [];         // { el, badge, marker }
    let visited = loadVisited();

    function list() { return pilgrim; }

    function loadVisited() {
        try {
            const v = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            return Array.isArray(v) ? v.filter((id) => typeof id === 'string' && pilgrim.some((s) => s.id === id)) : [];
        } catch (e) { return []; }
    }
    function saveVisited() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(visited)); } catch (e) { /* 保存不可でも継続 */ }
    }
    const isVisited = (spot) => spot.kind === 'pilgrim' && visited.includes(spot.id);

    function kanji(n) { return String(n); }
    function fmtDist(m) { return '約' + (m < 10000 ? (m / 1000).toFixed(1) : Math.round(m / 1000)) + 'km'; }
    function fmtTime(s) {
        const min = Math.max(1, Math.round(s / 60));
        if (min < 60) return '約' + min + '分';
        const h = Math.floor(min / 60), r = min % 60;
        return '約' + h + '時間' + (r ? r + '分' : '');
    }
    function legText(i) {
        if (legs && legs[i]) return fmtDist(legs[i].distance) + '・' + fmtTime(legs[i].duration);
        return legsFailed ? '—' : '計算中…';
    }
    function gmapsDir(dest, origin) {
        let url = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + dest[1] + ',' + dest[0];
        if (origin) url += '&origin=' + origin[1] + ',' + origin[0];
        return url;
    }
    function haversineKm(a, b) {
        const R = 6371, rad = Math.PI / 180;
        const dLat = (b[1] - a[1]) * rad, dLng = (b[0] - a[0]) * rad;
        const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * rad) * Math.cos(b[1] * rad) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(h));
    }
    function levelOf(spot) { return freshLevel(live.spots[spot.id]); }
    function sealText(spot, i) {
        if (spot.kind === 'pilgrim') return kanji(i + 1);
        if (spot.kind === 'parking') return 'P';
        if (spot.kind === 'site') return '射';
        return '見';
    }
    const guidable = (spot) => spot.kind !== 'site';

    // 混んでいる時、同じ種類で空いている最寄り
    function alternativeFor(i) {
        const spot = list()[i];
        let best = null;
        list().forEach((s, j) => {
            if (j === i || s.kind !== spot.kind) return;
            const lv = levelOf(s);
            if (lv === null || lv > 1) return;
            const d = haversineKm(spot.coords, s.coords);
            if (!best || d < best.d) best = { j, d, lv };
        });
        return best;
    }

    /* ---------- map ---------- */
    const map = new mapboxgl.Map({
        container: 'map',
        style: matchMedia('(prefers-color-scheme: dark)').matches ? 'mapbox://styles/mapbox/dark-v11' : 'mapbox://styles/mapbox/light-v11',
        center: [135.72, 33.51],
        zoom: 9.5
    });
    map.addControl(new mapboxgl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true,
        showUserHeading: true
    }), 'top-right');

    function fitAll(animate) {
        const b = new mapboxgl.LngLatBounds();
        list().forEach((s) => b.extend(s.coords));
        const top = $('header').offsetHeight + 10;
        map.fitBounds(b, { padding: { top, bottom: 40, left: 40, right: 40 }, duration: animate ? 800 : 0, maxZoom: 13 });
    }

    function setRoute(coords) {
        const data = { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } };
        const src = map.getSource('route42');
        if (src) { src.setData(data); return; }
        map.addSource('route42', { type: 'geojson', data });
        map.addLayer({ id: 'route42-casing', type: 'line', source: 'route42',
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: { 'line-color': '#ffffff', 'line-width': 7 } });
        map.addLayer({ id: 'route42-line', type: 'line', source: 'route42',
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: { 'line-color': '#0071e3', 'line-width': 4 } });
    }

    // 事前計算済み data/route.json（tools/build-route.mjs で生成）→ なければ Directions API
    async function loadRoute() {
        try {
            const r = await fetch('data/route.json');
            if (r.ok) {
                const j = await r.json();
                if (Array.isArray(j.legs) && j.legs.length === pilgrim.length - 1 && Array.isArray(j.coordinates)) {
                    setRoute(j.coordinates);
                    legs = j.legs;
                    render();
                    return;
                }
            }
        } catch (e) { /* フォールバック */ }
        try {
            const wp = pilgrim.map((s) => s.coords[0] + ',' + s.coords[1]).join(';');
            const r = await fetch('https://api.mapbox.com/directions/v5/mapbox/driving/' + wp +
                '?geometries=geojson&overview=full&access_token=' + mapboxgl.accessToken);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const j = await r.json();
            const route = j.routes && j.routes[0];
            if (!route) throw new Error('no route');
            setRoute(route.geometry.coordinates);
            legs = route.legs.map((l) => ({ distance: l.distance, duration: l.duration }));
        } catch (e) {
            console.warn('route unavailable:', e);
            legsFailed = true;
        }
        render();
    }

    function buildMarkers() {
        markers.forEach((m) => m.marker.remove());
        markers = list().map((spot, i) => {
            const el = document.createElement('button');
            el.type = 'button';
            el.className = 'marker' + (spot.kind === 'pilgrim' ? '' : ' square') + (spot.kind === 'site' ? ' site' : '');
            const seal = document.createElement('span');
            seal.className = 'marker-seal';
            seal.textContent = sealText(spot, i);
            const badge = document.createElement('span');
            badge.className = 'cong';
            badge.hidden = true;
            const label = document.createElement('span');
            label.className = 'marker-label';
            label.textContent = spot.name;
            el.append(seal, badge, label);
            el.addEventListener('click', (e) => { e.stopPropagation(); openSpot(i); });
            const marker = new mapboxgl.Marker({ element: el, anchor: 'top', offset: [0, -15] }).setLngLat(spot.coords).addTo(map);
            return { el, badge, marker };
        });
    }

    /* ---------- render ---------- */
    function renderHeader() {
        $('visitedCount').textContent = kanji(visited.length);
        $('spotTotal').textContent = kanji(pilgrim.length);

        // 打ち上げ当日は混雑情報ページへの案内を出す
        const launch = live.mode === 'launch';
        const banner = $('launchBanner');
        banner.hidden = !launch;
        if (launch) {
            const st = live.launch.state;
            $('launchState').textContent = LAUNCH_STATES[st];
            const t = formatLaunchTime(live.launch.time);
            $('launchSub').textContent = [t ? '予定 ' + t : '', live.launch.note].filter(Boolean).join(' ・ ');
            $('launchSub').hidden = !$('launchSub').textContent;
            banner.classList.toggle('alert', st === 'delayed' || st === 'scrubbed');
        }

        const notice = $('notice');
        notice.hidden = !live.notice;
        notice.textContent = '';
        if (live.notice) {
            notice.append(live.notice.text);
            const small = document.createElement('small');
            small.textContent = formatClock(live.notice.at) + ' 更新';
            notice.append(small);
        }
        // 現在地ボタンをヘッダーの下に
        document.documentElement.style.setProperty('--ctrl-top', ($('header').offsetHeight - 14) + 'px');
    }

    function renderMarkers() {
        markers.forEach((m, i) => {
            const spot = list()[i];
            m.el.classList.toggle('visited', isVisited(spot));
            m.el.classList.toggle('current', i === current);
            const lv = guidable(spot) ? levelOf(spot) : null;
            m.badge.hidden = lv === null;
            if (lv !== null) {
                m.badge.textContent = LEVELS[lv].short;
                m.badge.style.background = LEVELS[lv].color;
            }
            m.el.setAttribute('aria-label', spot.name + (lv !== null ? '（' + LEVELS[lv].label + '）' : ''));
        });
    }

    function congPill(spot) {
        const span = document.createElement('span');
        const lv = levelOf(spot);
        span.className = 'pill' + (lv === null ? ' none' : '');
        if (lv === null) {
            span.textContent = '情報なし';
        } else {
            span.textContent = LEVELS[lv].label;
            span.style.background = LEVELS[lv].color;
        }
        return span;
    }

    function renderSheet() {
        if (current < 0) return;
        const L = list(), i = current, spot = L[i];
        const isPil = spot.kind === 'pilgrim';
        const last = i === L.length - 1;

        const seal = $('spotSeal');
        seal.textContent = sealText(spot, i);
        seal.classList.toggle('visited', isVisited(spot));
        seal.style.borderRadius = isPil ? '50%' : '10px';
        let meta = isPil ? (i + 1) + '番目 ・ ' + spot.tag : spot.tag;
        if (spot.capacity) meta += ' ・ 収容 約' + spot.capacity.toLocaleString() + spot.unit;
        $('spotMeta').textContent = meta;
        $('spotName').textContent = spot.name;
        $('spotDesc').textContent = spot.desc;

        // 混雑
        const congVal = $('congVal');
        congVal.textContent = '';
        if (guidable(spot)) {
            congVal.append(congPill(spot));
            const e = live.spots[spot.id];
            if (levelOf(spot) !== null) congVal.append(' ' + formatClock(e.at) + ' 更新');
        } else {
            congVal.textContent = '—';
        }

        // 誘導
        const lv = levelOf(spot);
        const alt = lv !== null && lv >= 2 ? alternativeFor(i) : null;
        $('guide').hidden = !alt;
        if (alt) {
            const s = L[alt.j];
            $('guideText').textContent = '混雑しています。近くの空いている候補：' + s.name +
                '（直線 約' + alt.d.toFixed(1) + 'km・' + LEVELS[alt.lv].label + '）';
            $('guideBtn').textContent = s.name + ' を見る';
            $('guideBtn').onclick = () => openSpot(alt.j);
        }

        // 巡礼専用
        $('legRow').hidden = !isPil;
        $('stamps').hidden = !isPil;
        $('visitBtn').hidden = !isPil;
        $('pager').hidden = !isPil;
        if (isPil) {
            const legLabel = $('legLabel');
            legLabel.textContent = '';
            if (last) {
                legLabel.textContent = '最後のスポットです';
                $('legVal').textContent = '';
            } else {
                legLabel.append('次 ');
                const strong = document.createElement('strong');
                strong.textContent = L[i + 1].name;
                legLabel.append(strong);
                $('legVal').textContent = legText(i);
            }
            const stamps = $('stamps');
            while (stamps.children.length > 1) stamps.removeChild(stamps.lastChild);
            L.forEach((s, j) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'stamp' + (isVisited(s) ? ' visited' : '') + (j === i ? ' current' : '');
                b.textContent = kanji(j + 1);
                b.setAttribute('aria-label', (j + 1) + '番 ' + s.name + (isVisited(s) ? '（参拝済）' : ''));
                b.addEventListener('click', () => openSpot(j));
                stamps.append(b);
            });
            $('visitBtn').textContent = isVisited(spot) ? '参拝済（取り消す）' : '参拝する（押印）';
            $('visitBtn').classList.toggle('done', isVisited(spot));
            $('prevBtn').disabled = i === 0;
            $('nextBtn').disabled = last;
            $('nextRouteLink').style.visibility = last ? 'hidden' : 'visible';
            if (!last) $('nextRouteLink').href = gmapsDir(L[i + 1].coords, spot.coords);
        }

        const nav = $('navLink');
        nav.hidden = spot.kind === 'site';
        nav.href = gmapsDir(spot.coords);
    }

    function renderBook() {
        const total = $('bookTotal');
        const listEl = $('bookList');
        listEl.textContent = '';

        if (legs) {
            let d = 0, t = 0;
            legs.forEach((l) => { d += l.distance; t += l.duration; });
            total.textContent = '全' + pilgrim.length + '札所 ・ 全行程 ' + fmtDist(d) + '・' + fmtTime(t) + '（車）';
        } else {
            total.textContent = '全' + pilgrim.length + '札所 ・ 全行程 ' + (legsFailed ? '—' : '計算中…');
        }
        pilgrim.forEach((s, i) => {
            const sub = (isVisited(s) ? '参拝済' : '未参拝') + (i < pilgrim.length - 1 ? ' ・ 次まで ' + legText(i) : ' ・ 終着');
            listEl.append(bookItem(s, i, sub));
        });
    }

    function bookItem(s, i, sub) {
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'book-item';
        const seal = document.createElement('span');
        seal.className = 'seal-lg' + (isVisited(s) ? ' visited' : '');
        if (s.kind !== 'pilgrim') seal.style.borderRadius = '10px';
        seal.textContent = sealText(s, i);
        const txt = document.createElement('span');
        txt.className = 'grow';
        const name = document.createElement('div');
        name.className = 'book-name';
        name.textContent = s.name;
        const leg = document.createElement('div');
        leg.className = 'book-leg';
        leg.textContent = sub;
        txt.append(name, leg);
        b.append(seal, txt, congPill(s));
        b.addEventListener('click', () => { showTab('map'); openSpot(i); });
        li.append(b);
        return li;
    }

    function render() {
        renderHeader();
        renderMarkers();
        renderSheet();
        renderBook();
    }

    /* ---------- actions ---------- */
    function openSpot(i) {
        current = i;
        const sheet = $('sheet');
        sheet.classList.add('open');
        sheet.setAttribute('aria-hidden', 'false');
        render();
        map.flyTo({ center: list()[i].coords, zoom: 13, padding: { top: $('header').offsetHeight, bottom: sheet.offsetHeight, left: 0, right: 0 } });
    }
    function closeSheet() {
        current = -1;
        $('sheet').classList.remove('open');
        $('sheet').setAttribute('aria-hidden', 'true');
        render();
    }
    function showTab(name) {
        $('tabMap').setAttribute('aria-selected', String(name === 'map'));
        $('tabBook').setAttribute('aria-selected', String(name === 'book'));
        $('book').classList.toggle('open', name === 'book');
    }

    $('closeSheet').addEventListener('click', closeSheet);
    $('prevBtn').addEventListener('click', () => { if (current > 0) openSpot(current - 1); });
    $('nextBtn').addEventListener('click', () => { if (current < list().length - 1) openSpot(current + 1); });
    $('visitBtn').addEventListener('click', () => {
        if (current < 0) return;
        const spot = list()[current];
        if (spot.kind !== 'pilgrim') return;
        visited = isVisited(spot) ? visited.filter((id) => id !== spot.id) : visited.concat(spot.id);
        saveVisited();
        render();
    });
    $('tabMap').addEventListener('click', () => showTab('map'));
    $('tabBook').addEventListener('click', () => { closeSheet(); showTab('book'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
    map.on('click', closeSheet);

    /* ---------- boot ---------- */
    const store = await createStore();
    let mapReady = false;

    store.pollPublic((l) => {
        live = l;
        if (mapReady) render();
    }, (err) => console.warn('public status fetch failed:', err));

    // 鮮度判定を定期的に更新
    setInterval(() => { if (mapReady) render(); }, 60 * 1000);

    map.on('load', () => {
        setRoute(pilgrim.map((s) => s.coords)); // 道路形状取得までの仮表示
        mapReady = true;
        buildMarkers();
        render();
        fitAll(false);
        loadRoute();
    });
</script>
</body>
</html>
